[package]
name = "watch-replicator-quic"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bytes = "1.11"
quinn-proto = { version = "=0.11.19", default-features = false, features = ["rustls-ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.7", default-features = false, features = ["ring", "zeroize"] }
x509-parser = "0.18"
zeroize = "1.8"
jni = "=0.21.1"
